[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genmedia-vault"
version = "0.4.0"
description = "Self-hosted library and metadata search for AI-generated images"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.38,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "pillow>=11.1,<13", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26", "watchdog>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
genmedia = "genmedia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/genmedia"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires a dedicated PostgreSQL database"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
